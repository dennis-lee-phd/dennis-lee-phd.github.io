<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Dennis Lee</title>
    <!-- GitHub Pages serves this for any unknown path. The app uses hash routing,
         so real (non-hash) paths never resolve server-side. Re-route the path
         into the hash so the app's own "Page not found" screen handles it
         (e.g. /sdfs -> /#/sdfs -> NotFoundPage), rather than silently landing
         on the homepage. -->
    <script>
      var target = window.location.pathname + window.location.search;
      window.location.replace('/#' + target);
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
  </head>
  <body>
    <p>Page not found. <a href="/">Return to the homepage</a>.</p>
  </body>
</html>
